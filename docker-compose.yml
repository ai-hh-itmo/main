services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: http://backend:8080
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      REQUEST_TIMEOUT: "${REQUEST_TIMEOUT:-10s}"
      RETRY_COUNT: "${RETRY_COUNT:-2}"
      RETRY_DELAY: "${RETRY_DELAY:-500ms}"
      SUMMARIZER_URL: "${SUMMARIZER_URL:-http://host.docker.internal:8000}"
      EMBEDDER_URL: "${EMBEDDER_URL:-http://host.docker.internal:8001}"
      MATCHER_URL: "${MATCHER_URL:-http://host.docker.internal:8002}"
      RECSYS_URL: "${RECSYS_URL:-http://host.docker.internal:8003}"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped
